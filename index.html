<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>M3E Canvas</title>
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var w = Math.min(
            screen.width || 9999,
            innerWidth || 9999,
            document.documentElement.clientWidth || 9999
          );
          var phone =
            w <= 900 ||
            /iPhone|iPod|Android.+Mobile|webOS|BlackBerry|IEMobile|Opera Mini|Twitter|TwitterAndroid|Instagram|FBAN|FBAV|Line\//i.test(ua) ||
            /(?:^|[^A-Za-z])X\//i.test(ua) ||
            ((navigator.maxTouchPoints || 0) > 1 && w <= 1280) ||
            ("ontouchstart" in window && w <= 1024);
          if (phone) document.documentElement.setAttribute("data-phone", "1");
        } catch (e) {
          document.documentElement.setAttribute("data-phone", "1");
        }
      })();
    </script>
    <meta
      name="description"
      content="Sketch Material 3 Expressive screens in the browser and turn them into vibe-coding prompts. / Material 3 Expressive の画面をブラウザで組み立てて、そのままプロンプトに。"
    />
    <meta property="og:title" content="M3E Canvas" />
    <meta
      property="og:description"
      content="Design Material 3 Expressive screens, link them, preview them, and copy a prompt for your AI coding tool."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./og.png" />
    <link rel="icon" href="./public/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..700,0..1,0&display=block"
    />
    <link rel="stylesheet" href="./app/globals.css" />
  </head>
  <body style="font-family: Roboto, system-ui, sans-serif">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
